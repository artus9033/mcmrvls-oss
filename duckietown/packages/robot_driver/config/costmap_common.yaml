# Ref: http://wiki.ros.org/costmap_2d
global_frame: map

# footprint: [[-0.075, -0.07], [-0.075, 0.19], [0.075, 0.19], [0.075, -0.07]]
footprint: [[-0.025, -0.03], [-0.025, 0.19], [0.025, 0.19], [0.025, -0.03]]

always_send_full_costmap: true

track_unknown_space: false # allow planning into unmapped space

observation_sources: '' # no sensors

transform_tolerance: 1.5 # seconds, the time from last map topic reception after which the robot will be stopped (i.e., stop-on-stale-data threshold)
