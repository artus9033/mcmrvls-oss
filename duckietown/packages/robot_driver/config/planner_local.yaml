base_local_planner: 'teb_local_planner/TebLocalPlannerROS'

TebLocalPlannerROS:
  odom_topic: ''
  map_frame: '/mcmrvls/map' # planner uses AMCL or TF directly

  # Robot configuration - DIFFERENTIAL DRIVE (2 wheels)
  max_vel_x: 0.3
  max_vel_x_backwards: 0.01       # almost disabled - prefer turning in place
  max_vel_y: 0.0                  # CRITICAL: no lateral movement (differential drive constraint)
  max_vel_theta: 2.0              # increased for aggressive turning
  acc_lim_x: 0.8                  # increased for quicker acceleration
  acc_lim_theta: 1.5              # increased for aggressive angular acceleration
  
  # Differential drive kinematic constraints
  min_turning_radius: 0.0         # can turn in place (differential drive advantage)
  wheelbase: 0.076                # distance between wheels (from URDF: 7.6cm)
  cmd_angle_instead_rotvel: false # use angular velocity commands (standard for diff drive)

  # Robot footprint (from URDF and costmap_common.yaml)
  footprint_model:
    type: "polygon"
    vertices: [[-0.025, -0.03], [-0.025, 0.19], [0.025, 0.19], [0.025, -0.03]]

  # Trajectory timing - TUNED FOR FAST REACTION & CORNER FOLLOWING
  teb_autosize: true
  dt_ref: 0.25                    # slightly increased for smoother corners
  dt_hysteresis: 0.05             # tighter timing control
  min_samples: 4                  # increased for smoother trajectories around corners
  global_plan_overwrite_orientation: false  # CHANGED: let robot turn smoothly at corners
  max_global_plan_lookahead_dist: 1.0  # INCREASED: see further ahead for corners
  global_plan_viapoint_sep: 0.1   # CHANGED: create viapoints every 10cm to follow path
  feasibility_check_no_poses: 3   # increased for better corner validation

  # Optimization - AGGRESSIVE TURNING, NO BACKWARDS
  no_inner_iterations: 3          # slightly increased for better corner optimization
  no_outer_iterations: 3          # slightly increased for better corner optimization
  penalty_epsilon: 0.1            # adjusted for new max_vel_x_backwards
  weight_max_vel_x: 1.0           # reduced to allow more turning
  weight_max_vel_theta: 5.0       # INCREASED: strongly prioritize turning ability
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 3.0       # increased for aggressive angular changes
  weight_kinematics_nh: 1000.0    # CRITICAL: enforce non-holonomic (no lateral motion)
  weight_kinematics_forward_drive: 100.0  # STRONGLY prefer forward/turning over backwards
  weight_kinematics_turning_radius: 0.0  # not needed (can turn in place)
  weight_obstacle: 50             # BALANCED: respect obstacles but don't override path
  weight_viapoint: 20.0           # CRITICAL FIX: force following global plan at corners!
  weight_inflation: 0.3
  weight_dynamic_obstacle: 0
  selection_alternative_time_cost: false

  # Obstacles
  min_obstacle_dist: 0.15         # clearance distance (footprint already represents robot size)
  inflation_dist: 0.30            # obstacle influence radius
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.5
  obstacle_poses_affected: 15     # increased to better consider obstacles along path
  legacy_obstacle_association: false  # use improved obstacle association
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_association_cutoff_factor: 5.0

  # Misc
  shrink_horizon_backup: true
  allow_init_with_backwards_motion: false  # never start with backwards motion
  exact_arc_length: false         # faster approximate calculation
  
  # Additional responsiveness parameters
  xy_goal_tolerance: 0.1
  yaw_goal_tolerance: 0.15
  free_goal_vel: false
