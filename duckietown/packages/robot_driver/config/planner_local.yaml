base_local_planner: 'teb_local_planner/TebLocalPlannerROS'

TebLocalPlannerROS:
  odom_topic: ''
  map_frame: '/mcmrvls/map' # planner uses AMCL or TF directly

  # Robot configuration
  max_vel_x: 0.3
  max_vel_theta: 0.7
  acc_lim_x: 0.4
  acc_lim_theta: 0.5

  # Trajectory timing
  # teb_autosize: true
  # dt_ref: 0.3                 # bigger timestep = fewer samples
  # dt_hysteresis: 0.1
  # min_samples: 10              # keep it tiny
  # global_plan_overwrite_orientation: true
  # max_global_plan_lookahead_dist: 0.5
  # global_plan_viapoint_sep: -1
  # feasibility_check_no_poses: 0

  # # Optimization
  # no_inner_iterations: 2       # very low, saves CPU
  # no_outer_iterations: 2
  # penalty_epsilon: 0.1
  # weight_max_vel_x: 2
  # weight_max_vel_theta: 1
  # weight_acc_lim_x: 1
  # weight_acc_lim_theta: 1
  # weight_obstacle: 50          # push away from walls
  # weight_viapoint: 1
  # weight_inflation: 0.1
  # weight_dynamic_obstacle: 0
  # selection_alternative_time_cost: false

  # # Obstacles
  # min_obstacle_dist: 0.3       # keep robot away from walls
  # inflation_dist: 0.4
  # include_costmap_obstacles: true
  # costmap_obstacles_behind_robot_dist: 0.5
  # obstacle_poses_affected: 15

  # # Misc
  # shrink_horizon_backup: true
  # allow_init_with_backwards_motion: false
